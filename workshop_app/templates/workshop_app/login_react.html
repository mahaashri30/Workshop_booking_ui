{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Workshop Booking account">
    <title>Sign In - FOSSEE Workshops</title>
    
    <style>
        /* Minimal setup for React app */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        
        #react-root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- React App Container -->
    <div id="react-root"></div>

    <!-- Set global configuration for React app -->
    <script>
        // CSRF token for Django API requests
        window.CSRF_TOKEN = '{{ csrf_token }}';
        
        // API base URL
        window.API_BASE_URL = '{{ api_base_url|default:"http://localhost:8000" }}';
        
        // Debug mode
        window.DEBUG = {{ debug|lower }};
        
        // Initial page for the app
        window.INITIAL_PAGE = 'login';
    </script>

    <!-- React libraries from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Bundled React auth app (production minified) - CSS embedded in bundle -->
    <script src="{% static 'react/auth-bundle.min.js' %}"></script>

    <!-- Mount the React app -->
    <script>
        if (window.LoginPage && ReactDOM) {
            const root = ReactDOM.createRoot(document.getElementById('react-root'));
            root.render(React.createElement(window.LoginPage));
        }
    </script>
</body>
</html>
